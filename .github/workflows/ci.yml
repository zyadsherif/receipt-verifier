name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run example:smoke
      - if: matrix.node == 24
        run: npm run format:check
      - if: matrix.node == 24
        run: npm run test:coverage
      - if: matrix.node == 24
        run: npm run pack:check

  quality:
    name: quality
    runs-on: ubuntu-latest
    needs: test
    steps:
      - run: echo "All supported Node versions passed."
